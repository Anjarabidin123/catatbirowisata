<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

  <!-- Main Travel Bus Icon -->
  <g transform="translate(96, 88)" filter="url(#shadow)">
    <!-- Bus Body Outline & Fill -->
    <path d="M40 50 C40 22 62 0 90 0 L230 0 C258 0 280 22 280 50 L280 220 C280 236 267 250 250 250 L250 275 C250 288 238 300 225 300 L205 300 C192 300 180 288 180 275 L180 250 L140 250 L140 275 C140 288 128 300 115 300 L95 300 C82 300 70 288 70 275 L70 250 C53 250 40 236 40 220 Z" fill="#ffffff" />
    
    <!-- Windshield -->
    <path d="M60 45 C60 30 72 20 88 20 L232 20 C248 20 260 30 260 45 L260 110 L60 110 Z" fill="#1e293b" />
    
    <!-- Windshield Reflection -->
    <path d="M75 28 L150 28 L125 102 L68 102 Z" fill="rgba(255,255,255,0.15)" />
    
    <!-- Destination Sign / LED Banner -->
    <rect x="95" y="32" width="130" height="18" rx="4" fill="#0284c7" />
    <circle cx="108" cy="41" r="3" fill="#38bdf8" />
    <line x1="120" y1="41" x2="210" y2="41" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Front Grille -->
    <rect x="95" y="160" width="130" height="40" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <line x1="110" y1="172" x2="210" y2="172" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="110" y1="180" x2="210" y2="180" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="110" y1="188" x2="210" y2="188" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Headlights -->
    <circle cx="70" cy="175" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <circle cx="70" cy="175" r="7" fill="#fef3c7" />
    <circle cx="250" cy="175" r="14" fill="#f59e0b" stroke="#ffffff" stroke-width="3" />
    <circle cx="250" cy="175" r="7" fill="#fef3c7" />

    <!-- Bumper & License Plate -->
    <rect x="60" y="215" width="200" height="24" rx="6" fill="#334155" />
    <rect x="125" y="219" width="70" height="16" rx="3" fill="#ffffff" />
    <text x="160" y="231" font-family="sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">AGEN BIRO</text>

    <!-- Side Mirrors -->
    <path d="M40 70 L20 85 L20 120 L40 105 Z" fill="#475569" />
    <path d="M280 70 L300 85 L300 120 L280 105 Z" fill="#475569" />
  </g>

  <!-- Compass Star Emblem in Bottom Right -->
  <g transform="translate(370, 370)">
    <circle cx="0" cy="0" r="48" fill="#0f172a" stroke="#f59e0b" stroke-width="4" filter="url(#shadow)" />
    <!-- 4-point star -->
    <polygon points="0,-36 9,-9 36,0 9,9 0,36 -9,9 -36,0 -9,-9" fill="#f59e0b" />
    <polygon points="0,-36 0,0 -9,-9" fill="#d97706" />
    <polygon points="36,0 0,0 9,-9" fill="#fbbf24" />
    <polygon points="0,36 0,0 9,9" fill="#b45309" />
    <polygon points="-36,0 0,0 -9,9" fill="#f59e0b" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
</svg>
