name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pukul 00:00 UTC (Supabase pause setelah 7 hari inaktif)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  ping:
    name: Ping Database Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Request ke Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://xirxglkwojgbzjyhhdhm.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpcnhnbGt3b2pnYnpqeWhoZGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzc3MjgsImV4cCI6MjEwNzg1MzcyOH0.Jpete8y6K2AwmOiFeLCSzyWDv4rbKQctzQnaHtgMV3I' }}
        run: |
          echo "Memeriksa status Supabase di $SUPABASE_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1")
          
          echo "HTTP Response Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Berhasil! Supabase aktif dan tidak akan di-pause."
          else
            echo "Gagal atau respons tidak terduga: $HTTP_STATUS"
            exit 1
          fi
